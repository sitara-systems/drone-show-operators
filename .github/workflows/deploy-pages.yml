name: Deploy preview to GitHub Pages

# Interim preview deploy only -- the production home for The Fleet Operator Directory is
# https://skies.sitara.systems/drone-show-operators/ (folded into sitara-skies-website's
# own deploy pipeline). This workflow publishes the same build to GitHub
# Pages at a *different* URL for a quick look/diff, with NOINDEX=1 so the
# preview is never indexed or cited in place of the production URL -- same
# convention as the Experiential Design Index's preview workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r site/requirements.txt
      - name: Build site
        working-directory: site
        env:
          NOINDEX: "1"
          SITE_URL: https://sitara-systems.github.io/drone-show-operators
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
